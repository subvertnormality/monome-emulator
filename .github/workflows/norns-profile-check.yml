name: norns performance profile check

on:
  push:
    branches: [codex/norns-performance-calibration]
    paths:
      - profiles/norns/**
      - patches/norns/candidates/performance-cost-profile.patch
      - scripts/calibration/**
      - fixtures/probes/norns-calibration/**
      - src/automation/performance_profile.py
      - .github/workflows/norns-profile-check.yml
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out opt-in application fixture (Mosaic calibration runners)
        uses: actions/checkout@v4
        with:
          repository: subvertnormality/mosaic
          ref: codex/norns-calibration-runners
          path: app
          submodules: true
      - name: Prepare container context
        run: |
          mv app "$RUNNER_TEMP/app"
          python3 scripts/container/prepare.py --output .runtime/docker-context
      - name: Build emulator image
        run: docker build --platform linux/amd64 --progress plain -t monome-emulator:profile-check .runtime/docker-context
      - name: Run profile check
        run: |
          mkdir -p out
          docker run --rm --user root --shm-size 256m -v "$PWD/out:/out" -v "$RUNNER_TEMP/app:/app:ro" \
            -e APP_CASES="PERF-002-HW-1 PERF-002-HW-4 PERF-002-HW-8 PERF-002-HW-16 PERF-003-HW-16 PERF-005-HW-1 PERF-005-HW-4 PERF-008L-HW-4 MIX-HW-8" \
            -e APP_LANE=tests/behaviour/perf_calibration_emulator.py \
            --entrypoint bash monome-emulator:profile-check scripts/calibration/ci_profile_check.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: norns-profile-check
          path: out
